name: CI Pipeline

on:
  push:
    branches:
      - devops-backend  # Trigger on push to the devops-backend branch
  pull_request:
    branches:
      - devops-backend  # Trigger on pull request to the devops-backend branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Build and run with Docker Compose
      - name: Build and run with Docker Compose
        run: |
          docker-compose -f docker-compose.yml build
          docker-compose -f docker-compose.yml up -d

      # Optional: Skip pushing to Docker Hub if no secrets are set
      # Remove the push step if you don't want to push to Docker Hub
      - name: Optional Push Docker images to Docker Hub (skip if unnecessary)
        run: |
          # If pushing is not needed, you can remove this section
          docker login -u "your-dockerhub-username" -p "your-dockerhub-password"
          docker-compose -f docker-compose.yml push
