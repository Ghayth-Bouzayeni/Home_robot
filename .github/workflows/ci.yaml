name: CI Pipeline

on:
  push:
    branches:
      - devops-backend  # Trigger on push to the devops-backend branch
  pull_request:
    branches:
      - devops-backend  # Trigger on pull request to the devops-backend branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Python for the backend
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      # Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt  

      # Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build -t home_robot-master_backend:latest ./backend  

      # Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t home_robot-master_frontend:latest ./frontend  

      # Run the backend container
      - name: Run backend Docker container
        run: |
          docker run -d -p 5000:5000 home_robot-master_backend:latest

      # Run the frontend container
      - name: Run frontend Docker container
        run: |
          docker run -d -p 80:80 home_robot-master_frontend:latest
