name: Backend CI

on:
  push:
    branches: [ devops-update ]
  pull_request:
    branches: [ devops-update ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Flask App Test (basic check)
      run: |
        cd backend
        python -m py_compile app.py  # Check for syntax errors

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        cd backend
        docker build -t home-backend .
      
    - name: Run Docker Container
      run: |
        docker run -d -p 5000:5000 home-backend

    - name: Check if the Flask App is running inside Docker
      run: |
        curl --silent --fail http://localhost:5000 || exit 1  # Check if app is up
